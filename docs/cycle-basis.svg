<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" role="img" aria-labelledby="title">
  <title id="title">A graph with its minimum cycle basis of five cycles highlighted</title>
  <style>
    .face { fill-opacity: 0.35; }
    .edge { stroke: #374151; stroke-width: 2.5; stroke-linecap: round; }
    .vertex circle { fill: #ffffff; stroke: #374151; stroke-width: 2.5; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      .face { fill-opacity: 0.6; }
      .edge { stroke: #d1d5db; }
      .vertex circle { fill: #0d1117; stroke: #d1d5db; }
    }
  </style>

  <!-- the five cycles of the minimum cycle basis -->
  <polygon class="face" fill="#3b82c4" points="60,150 150,60 150,240"/>
  <polygon class="face" fill="#0d9488" points="150,60 260,150 150,240"/>
  <polygon class="face" fill="#d4a017" points="150,60 330,50 260,150"/>
  <polygon class="face" fill="#c026d3" points="150,240 260,150 330,250"/>
  <polygon class="face" fill="#ea580c" points="260,150 330,50 420,150 330,250"/>

  <!-- edges -->
  <g class="edge">
    <line x1="60" y1="150" x2="150" y2="60"/>
    <line x1="60" y1="150" x2="150" y2="240"/>
    <line x1="150" y1="60" x2="150" y2="240"/>
    <line x1="150" y1="60" x2="260" y2="150"/>
    <line x1="150" y1="60" x2="330" y2="50"/>
    <line x1="150" y1="240" x2="260" y2="150"/>
    <line x1="150" y1="240" x2="330" y2="250"/>
    <line x1="260" y1="150" x2="330" y2="50"/>
    <line x1="260" y1="150" x2="330" y2="250"/>
    <line x1="330" y1="50" x2="420" y2="150"/>
    <line x1="330" y1="250" x2="420" y2="150"/>
  </g>


  <!-- vertices -->
  <g class="vertex">
    <circle cx="60" cy="150" r="6"/>
    <circle cx="150" cy="60" r="6"/>
    <circle cx="150" cy="240" r="6"/>
    <circle cx="260" cy="150" r="6"/>
    <circle cx="330" cy="50" r="6"/>
    <circle cx="330" cy="250" r="6"/>
    <circle cx="420" cy="150" r="6"/>
  </g>
</svg>
